services:
  authoring:
    build:
      context: ../..
      dockerfile: chess-authoring/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AUTHORING_HOST_PORT:-8796}:8796"
    environment:
      AUTHORING_BASE_PATH: ${AUTHORING_BASE_PATH:-/autochess-lab}
      AUTHORING_PUBLIC_ORIGIN: ${AUTHORING_PUBLIC_ORIGIN:-}
      AUTHORING_RELAY_TTL_MS: ${AUTHORING_RELAY_TTL_MS:-120000}
      AUTHORING_RELAY_MAX_SESSIONS: ${AUTHORING_RELAY_MAX_SESSIONS:-64}
      AUTHORING_RELAY_MAX_BYTES: ${AUTHORING_RELAY_MAX_BYTES:-32768}
      AUTHORING_BODY_LIMIT: ${AUTHORING_BODY_LIMIT:-40kb}
    cpus: ${AUTHORING_CPUS:-0.5}
    mem_limit: ${AUTHORING_MEMORY:-256m}
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
