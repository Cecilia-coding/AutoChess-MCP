<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
            <!-- 衔着的新绿与金叶橄榄枝 -->
            <g stroke="#cca046" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
              <!-- 枝茎 -->
              <path d="M 14,21 Q 8,18 4,23" fill="none"/>
              <!-- 橄榄嫩叶 -->
              <path d="M 10,18 C 8,14 4,16 6,19 C 7,21 10,20 10,18 Z" fill="#96bb81"/>
              <path d="M 5,22 C 2,20 0,23 2,25 C 4,27 6,24 5,22 Z" fill="#7fa06a"/>
              <path d="M 8,23 C 7,26 10,28 12,26 C 13,24 10,21 8,23 Z" fill="#96bb81"/>
              <!-- 金色橄榄果 -->
              <circle cx="8" cy="20" r="1.2" fill="#e5be6b" stroke="none"/>
            </g>

            <!-- 圣白鸽身躯与双翼 (羽翼舒展的古典浮雕) -->
            <!-- 远翼 (后方展翅) -->
            <path d="M 21,17 C 20,11 16,5 11,3 C 14,8 17,13 18,17 Z" fill="#e5f0e3"/>
            <path d="M 18,15 C 19,10 16,6 13,4 C 15,8 17,12 17,15 Z" fill="#f4f9f2"/>

            <!-- 近翼 (主羽翼，层叠飞羽) -->
            <g fill="#fbfdfa">
              <path d="M 23,19 C 26,11 32,4 40,3 C 35,8 31,14 27,18 C 33,12 38,10 42,8 C 37,13 33,18 29,22 C 34,18 38,17 41,16 C 36,20 32,24 27,24 C 24,24 22,22 23,19 Z" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.15))"/>
              <path d="M 25,18 C 29,13 34,8 39,5 C 35,9 31,14 28,18 Z" fill="#ffffff"/>
            </g>

            <!-- 身躯、头颈与三叠尾羽 -->
            <path d="M 13,20 C 13,17 16,14 19,14 C 23,14 26,17 28,21 C 32,22 36,24 41,26 C 37,27 34,26 31,25 C 34,28 37,30 39,32 C 34,31 30,29 27,27 C 24,28 20,27 17,24 C 15,24 13,22 13,20 Z" fill="#ffffff"/>

            <!-- 鸽喙 (金喙衔枝) -->
            <polygon points="11,20 14,18.5 14,21.5" fill="#cca046"/>

            <!-- 柔和明眸 -->
            <circle cx="16.5" cy="17.5" r="1.2" fill="#1b3325"/>
            <circle cx="16.8" cy="17.2" r="0.5" fill="#ffffff"/>
          </svg>
